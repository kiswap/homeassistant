# Runs the hub from its image. On krpi this file sits next to the env file
# and config/settings.json; the code itself is only in the image. The image
# comes from tools/build-image.sh. It runs the newest loaded image (latest)
# unless TAG names an older one (see DEPLOY.md).
services:
  homeassistant:
    image: homeassistant:${TAG:-latest}
    # Published on all of krpi's addresses, so the home network can also use
    # the port directly. The router does not forward it. Access from outside
    # goes through the nginx reverse proxy on krpi, under /homeassistant/.
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    environment:
      SETTINGS_PATH: ${SETTINGS_PATH:-/app/config/settings.json}
    volumes:
      # The folder, not the file: an editor that replaces settings.json
      # would otherwise leave the container reading the old file.
      - ./config:/app/config:ro
      - ${DATA_DIR:-./data}:/data
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
